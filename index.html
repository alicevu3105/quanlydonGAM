<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0f2942">
<title>Quản Lý Đơn Đặt Hàng &amp; Nhà Cung Cấp</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{
  --navy:#0f2942;--primary:#1a5296;--primary-dark:#0d3a6e;--primary-light:#e8f0f9;
  --bg:#f4f6f9;--surface:#ffffff;--border:#e1e6ec;--border-strong:#c7d0dc;
  --text:#1c2733;--text-muted:#5b6b7c;--text-faint:#8996a5;
  --success:#1b8a5a;--success-bg:#e6f6ee;--warning:#c9720a;--warning-bg:#fdf0dc;
  --danger:#c62828;--danger-bg:#fce9e9;--draft:#6b7280;--draft-bg:#eef0f2;
  --radius:10px;--radius-sm:6px;
  --shadow:0 1px 3px rgba(15,41,66,.08),0 1px 2px rgba(15,41,66,.06);
  --shadow-lg:0 8px 24px rgba(15,41,66,.16);
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --nav-h:60px;--bottom-h:64px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font);background:var(--bg);color:var(--text);
  -webkit-text-size-adjust:100%;line-height:1.45;
  padding-bottom:var(--bottom-h);
}
button,input,select,textarea{font-family:inherit;font-size:15px;color:inherit;}
button{cursor:pointer;}
h1,h2,h3,h4{margin:0 0 4px 0;font-weight:600;color:var(--navy);}
p{margin:0 0 8px 0;}
a{color:var(--primary);}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:4px;}

/* Error banner */
#error-banner{position:fixed;top:0;left:0;right:0;z-index:9999;background:var(--danger);color:#fff;
  transform:translateY(-100%);transition:transform .25s ease;box-shadow:0 2px 8px rgba(0,0,0,.2);}
#error-banner.visible{transform:translateY(0);}
.error-banner-inner{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;max-width:1000px;margin:0 auto;}
.error-icon{font-size:18px;line-height:1.3;flex-shrink:0;}
.error-text{flex:1;font-size:14px;font-weight:500;word-break:break-word;}
.error-close{background:rgba(255,255,255,.2);border:none;color:#fff;width:26px;height:26px;border-radius:6px;font-size:16px;flex-shrink:0;}
.error-close:hover{background:rgba(255,255,255,.35);}

/* Toasts */
#toast-container{position:fixed;bottom:calc(var(--bottom-h) + 12px);left:0;right:0;z-index:9998;
  display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 12px;}
@media(min-width:900px){#toast-container{bottom:16px;}}
.toast{pointer-events:auto;max-width:420px;width:100%;background:var(--navy);color:#fff;padding:12px 16px;
  border-radius:var(--radius-sm);box-shadow:var(--shadow-lg);font-size:14px;font-weight:500;
  opacity:0;transform:translateY(8px);transition:opacity .25s,transform .25s;}
.toast.show{opacity:1;transform:translateY(0);}
.toast-success{background:#166a45;}
.toast-error{background:#a82323;}
.toast-warning{background:#a85e0a;}
.toast-info{background:var(--navy);}

/* Modal */
#modal-root{position:fixed;inset:0;z-index:9997;display:none;}
#modal-root.visible{display:block;}
.modal-overlay{position:fixed;inset:0;background:rgba(15,25,38,.5);display:flex;align-items:flex-end;justify-content:center;padding:0;}
@media(min-width:640px){.modal-overlay{align-items:center;padding:20px;}}
.modal-box{background:#fff;border-radius:14px 14px 0 0;max-width:520px;width:100%;max-height:88vh;overflow-y:auto;
  padding:20px;box-shadow:var(--shadow-lg);}
@media(min-width:640px){.modal-box{border-radius:var(--radius);}}
.modal-title{font-size:17px;margin-bottom:8px;}
.modal-message{color:var(--text-muted);font-size:14px;margin-bottom:16px;white-space:pre-line;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}

/* Layout */
#app-shell{display:flex;min-height:100vh;}
.sidebar-desktop{display:none;}
#app-content{flex:1;min-width:0;padding:14px 14px 24px;max-width:1180px;width:100%;margin:0 auto;}
@media(min-width:900px){
  body{padding-bottom:0;}
  .sidebar-desktop{display:flex;flex-direction:column;width:230px;flex-shrink:0;background:var(--navy);color:#fff;
    position:sticky;top:0;height:100vh;padding:18px 0;}
  #app-content{padding:22px 28px 40px;}
}
.bottom-nav-mobile{position:fixed;bottom:0;left:0;right:0;height:var(--bottom-h);background:#fff;
  border-top:1px solid var(--border);display:flex;z-index:500;box-shadow:0 -2px 8px rgba(15,41,66,.06);}
@media(min-width:900px){.bottom-nav-mobile{display:none;}}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background:none;border:none;color:var(--text-muted);font-size:11px;padding:6px 2px;}
.nav-btn svg{width:21px;height:21px;}
.nav-btn.active{color:var(--primary);}
.sidebar-desktop .nav-btn{flex-direction:row;justify-content:flex-start;gap:12px;color:#c3d2e3;font-size:14px;
  padding:11px 20px;font-weight:500;border-radius:0;}
.sidebar-desktop .nav-btn.active{background:rgba(255,255,255,.1);color:#fff;border-right:3px solid #fff;}
.sidebar-desktop .nav-btn:hover{color:#fff;}
.sidebar-brand{padding:4px 20px 18px;color:#fff;font-size:16px;font-weight:700;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:10px;}
.sidebar-brand small{display:block;font-weight:400;font-size:11px;color:#9fb3c8;margin-top:2px;}
.sidebar-footer{margin-top:auto;padding:12px 20px 0;}

/* Top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px;}
.topbar h1{font-size:20px;}
.icon-btn{background:#fff;border:1px solid var(--border);width:38px;height:38px;border-radius:var(--radius-sm);
  display:flex;align-items:center;justify-content:center;color:var(--text-muted);flex-shrink:0;}
.icon-btn:hover{background:var(--primary-light);color:var(--primary);}
.icon-btn svg{width:19px;height:19px;}

/* Cards / surfaces */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow);}
.card-title{font-size:14px;text-transform:uppercase;letter-spacing:.03em;color:var(--text-muted);margin-bottom:10px;font-weight:700;}
.grid-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px;}
@media(min-width:640px){.grid-stats{grid-template-columns:repeat(3,1fr);}}
@media(min-width:1100px){.grid-stats{grid-template-columns:repeat(5,1fr);}}
.stat-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);}
.stat-card .label{font-size:12px;color:var(--text-muted);font-weight:600;margin-bottom:6px;}
.stat-card .value{font-size:20px;font-weight:700;color:var(--navy);word-break:break-word;}
.stat-card.accent-warn .value{color:var(--warning);}
.stat-card.accent-danger .value{color:var(--danger);}
.stat-card.accent-success .value{color:var(--success);}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:var(--radius-sm);
  padding:10px 16px;font-size:14px;font-weight:600;background:var(--border);color:var(--text);white-space:nowrap;}
.btn svg{width:16px;height:16px;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-dark);}
.btn-secondary{background:#fff;color:var(--text);border:1px solid var(--border-strong);}
.btn-secondary:hover{background:var(--bg);}
.btn-danger{background:var(--danger);color:#fff;}
.btn-danger:hover{background:#a82020;}
.btn-success{background:var(--success);color:#fff;}
.btn-sm{padding:7px 11px;font-size:13px;}
.btn-block{width:100%;}
.btn-link{background:none;color:var(--primary);padding:6px 0;font-weight:600;}
.btn[disabled]{opacity:.55;pointer-events:none;}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;}

/* Forms */
.form-group{margin-bottom:14px;}
.form-row{display:grid;grid-template-columns:1fr;gap:12px;}
@media(min-width:640px){.form-row.cols-2{grid-template-columns:1fr 1fr;}.form-row.cols-3{grid-template-columns:1fr 1fr 1fr;}}
label{display:block;font-size:13px;font-weight:600;color:var(--text);margin-bottom:5px;}
label .optional-tag{font-weight:400;color:var(--text-faint);font-size:12px;}
label .req{color:var(--danger);}
.input,input[type=text],input[type=date],input[type=number],select,textarea{
  width:100%;padding:11px 12px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);
  background:#fff;font-size:15px;}
.input:focus,input:focus,select:focus,textarea:focus{outline:2px solid var(--primary);outline-offset:-1px;border-color:var(--primary);}
textarea{resize:vertical;min-height:64px;}
.input-invalid{border-color:var(--danger)!important;background:var(--danger-bg);}
.field-error-msg{display:none;color:var(--danger);font-size:12.5px;margin-top:4px;font-weight:600;}
.field-with-btn{display:flex;gap:8px;}
.field-with-btn select{flex:1;}
.help-text{font-size:12.5px;color:var(--text-muted);margin-top:4px;}
.readonly-box{background:var(--primary-light);border:1px solid #cfe0f2;border-radius:var(--radius-sm);padding:10px 12px;font-size:14px;}
.calc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px;}
.calc-item{background:var(--primary-light);border-radius:var(--radius-sm);padding:10px 12px;}
.calc-item .l{font-size:12px;color:var(--text-muted);font-weight:600;}
.calc-item .v{font-size:16px;font-weight:700;color:var(--navy);}
.calc-item.total .v{color:var(--primary-dark);font-size:18px;}

/* Badges */
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap;}
.badge-nhap{background:var(--draft-bg);color:var(--draft);}
.badge-da_dat{background:var(--primary-light);color:var(--primary-dark);}
.badge-nhap_mot_phan{background:var(--warning-bg);color:var(--warning);}
.badge-da_nhap_du{background:var(--success-bg);color:var(--success);}
.badge-da_huy{background:var(--danger-bg);color:var(--danger);}

/* Filters bar */
.filter-bar{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:14px;
  display:grid;grid-template-columns:1fr;gap:10px;}
@media(min-width:760px){.filter-bar{grid-template-columns:repeat(auto-fit,minmax(160px,1fr));align-items:end;}}
.filter-bar .fg{margin:0;}
.filter-bar label{font-size:12px;margin-bottom:3px;color:var(--text-muted);}

/* Table */
.table-wrap{overflow-x:auto;background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:920px;}
thead th{text-align:left;background:var(--bg);color:var(--text-muted);font-weight:700;font-size:12px;
  text-transform:uppercase;letter-spacing:.02em;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;}
tbody td{padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--bg);}
.num-cell{text-align:right;font-variant-numeric:tabular-nums;}
.desktop-only{display:none;}
.mobile-only{display:block;}
@media(min-width:900px){.desktop-only{display:block;}.mobile-only{display:none;}}

/* Cards list (mobile orders) */
.item-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;box-shadow:var(--shadow);}
.item-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px;}
.item-card-head .po-no{font-weight:700;color:var(--navy);font-size:15px;}
.item-card .sub{color:var(--text-muted);font-size:13px;}
.item-card-rows{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin:10px 0;font-size:13px;}
.item-card-rows .l{color:var(--text-muted);}
.item-card-rows .v{font-weight:600;text-align:right;}
.item-card-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}

.empty-state{text-align:center;padding:50px 16px;color:var(--text-muted);}
.empty-state svg{width:48px;height:48px;color:var(--border-strong);margin-bottom:10px;}

.section-title-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px;}

.kv-list{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;}
@media(min-width:640px){.kv-list{grid-template-columns:1fr 1fr 1fr;}}
.kv-list .l{font-size:12px;color:var(--text-muted);font-weight:600;}
.kv-list .v{font-size:14.5px;font-weight:600;}

.detail-header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
.back-link{display:inline-flex;align-items:center;gap:6px;color:var(--text-muted);font-size:13px;font-weight:600;margin-bottom:10px;background:none;border:none;padding:0;}
.back-link svg{width:16px;height:16px;}

.tag-loai{display:inline-block;background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:2px 10px;font-size:12px;font-weight:600;color:var(--text-muted);}

#export-render-area{position:absolute;left:-99999px;top:0;width:780px;background:#fff;}
.phieu{padding:36px;font-family:var(--font);color:#1c2733;background:#fff;}
.phieu h2{font-size:22px;text-align:center;letter-spacing:.04em;color:var(--navy);margin-bottom:2px;}
.phieu .phieu-sub{text-align:center;color:var(--text-muted);font-size:12px;margin-bottom:20px;}
.phieu .phieu-topline{display:flex;justify-content:space-between;margin-bottom:18px;font-size:13.5px;border-bottom:2px solid var(--navy);padding-bottom:12px;}
.phieu .phieu-section{margin-bottom:16px;}
.phieu .phieu-section h4{font-size:13px;text-transform:uppercase;color:var(--primary-dark);border-bottom:1px solid var(--border);padding-bottom:5px;margin-bottom:8px;}
.phieu .kv2{display:grid;grid-template-columns:1fr 1fr;gap:6px 20px;font-size:13.5px;}
.phieu .kv2 .l{color:var(--text-muted);}
.phieu table{min-width:0;font-size:12.5px;}
.phieu table th, .phieu table td{padding:6px 8px;}
.phieu .total-box{background:var(--primary-light);border-radius:8px;padding:12px 14px;margin-top:10px;}
.phieu .total-box .row{display:flex;justify-content:space-between;font-size:13.5px;padding:2px 0;}
.phieu .total-box .row.grand{font-size:16px;font-weight:700;color:var(--primary-dark);border-top:1px solid #cfe0f2;margin-top:6px;padding-top:8px;}
.phieu .signatures{display:flex;justify-content:space-between;margin-top:36px;text-align:center;}
.phieu .signatures div{width:45%;font-size:13px;}
.phieu .sign-line{margin-top:60px;border-top:1px solid #333;padding-top:4px;color:var(--text-muted);font-size:11.5px;}

.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div id="error-banner"><div class="error-banner-inner"></div></div>
<div id="toast-container"></div>
<div id="modal-root"></div>

<div id="app-shell">
  <aside class="sidebar-desktop">
    <div class="sidebar-brand">Quản Lý Đơn Hàng<small>Ngành sợi &amp; dệt may</small></div>
    <div id="nav-desktop"></div>
    <div class="sidebar-footer">
      <button class="nav-btn" data-section="backup" onclick="location.hash='#/backup'">⚙️ Sao lưu / Dữ liệu</button>
    </div>
  </aside>
  <main id="app-content"></main>
</div>

<nav class="bottom-nav-mobile" id="nav-mobile"></nav>
<div id="export-render-area"></div>

<script>
'use strict';

/* ===================== 1. AN TOÀN & BÁO LỖI TOÀN CỤC ===================== */
function reportError(message){
  try{
    console.error(message);
    var banner = document.getElementById('error-banner');
    var inner = banner.querySelector('.error-banner-inner');
    inner.innerHTML = '<span class="error-icon">⚠️</span><span class="error-text"></span><button class="error-close" aria-label="Đóng" onclick="document.getElementById(\'error-banner\').classList.remove(\'visible\')">×</button>';
    inner.querySelector('.error-text').textContent = message;
    banner.classList.add('visible');
  }catch(e){ /* nothing more we can do */ }
}
window.addEventListener('error', function(e){
  reportError('Lỗi hệ thống: ' + (e && e.message ? e.message : 'Không xác định'));
});
window.addEventListener('unhandledrejection', function(e){
  var msg = (e && e.reason && e.reason.message) ? e.reason.message : String(e && e.reason);
  reportError('Lỗi xử lý (bất đồng bộ): ' + msg);
});

/* ===================== 2. LƯU TRỮ DỮ LIỆU (localStorage) ===================== */
var STORAGE_PREFIX = 'qldh_';
var Storage = {
  get: function(key, defVal){
    try{
      var raw = localStorage.getItem(STORAGE_PREFIX + key);
      if (raw === null || raw === undefined) return defVal;
      var parsed = JSON.parse(raw);
      return parsed;
    }catch(err){
      reportError('Không đọc được dữ liệu "' + key + '": ' + err.message);
      return defVal;
    }
  },
  set: function(key, value){
    try{
      localStorage.setItem(STORAGE_PREFIX + key, JSON.stringify(value));
      return true;
    }catch(err){
      var extra = '';
      if (err && err.name === 'QuotaExceededError') extra = ' (Bộ nhớ trình duyệt đã đầy.)';
      reportError('KHÔNG LƯU ĐƯỢC dữ liệu "' + key + '": ' + err.message + extra + ' Vui lòng thử lại hoặc sao lưu dữ liệu ngay.');
      return false;
    }
  }
};
function checkStorageAvailable(){
  try{
    var t = '__qldh_test__';
    localStorage.setItem(t,'1'); localStorage.removeItem(t);
    return true;
  }catch(e){
    reportError('Trình duyệt của bạn đang chặn lưu trữ dữ liệu (có thể do chế độ ẩn danh / duyệt riêng tư). Ứng dụng sẽ KHÔNG lưu được dữ liệu. Vui lòng mở bằng trình duyệt/thẻ bình thường.');
    return false;
  }
}

function getOrders(){ return Storage.get('orders', []); }
function saveOrders(v){ return Storage.set('orders', v); }
function getReceipts(){ return Storage.get('receipts', []); }
function saveReceipts(v){ return Storage.set('receipts', v); }
function getSuppliers(){ return Storage.get('suppliers', []); }
function saveSuppliers(v){ return Storage.set('suppliers', v); }
function getAddresses(){ return Storage.get('addresses', []); }
function saveAddresses(v){ return Storage.set('addresses', v); }

/* ===================== 3. TIỆN ÍCH ===================== */
function uid(){
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2);
}
function escapeHtml(str){
  if (str === null || str === undefined) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function todayISO(){
  var d = new Date();
  var m = String(d.getMonth()+1).padStart(2,'0');
  var day = String(d.getDate()).padStart(2,'0');
  return d.getFullYear() + '-' + m + '-' + day;
}
function formatDateDMY(iso){
  if (!iso) return '—';
  var p = iso.split('-');
  if (p.length !== 3) return iso;
  return p[2] + '/' + p[1] + '/' + p[0];
}
function formatInt(n){
  if (n === null || n === undefined || isNaN(n)) return '0';
  return Math.round(n).toLocaleString('vi-VN');
}
function formatDec(n, maxDec){
  if (n === null || n === undefined || isNaN(n)) return '0';
  maxDec = maxDec === undefined ? 2 : maxDec;
  return n.toLocaleString('vi-VN', {minimumFractionDigits:0, maximumFractionDigits:maxDec});
}
function formatVND(n){
  if (n === null || n === undefined || isNaN(n)) return '0 đ';
  return Math.round(n).toLocaleString('vi-VN') + ' đ';
}
function parseVNNumber(input){
  if (input === null || input === undefined) return NaN;
  var raw = String(input).trim();
  if (raw === '') return NaN;
  var s = raw.replace(/\s/g,'');
  var lastComma = s.lastIndexOf(',');
  var lastDot = s.lastIndexOf('.');
  if (lastComma !== -1 && lastDot !== -1){
    if (lastComma > lastDot){ s = s.replace(/\./g,'').replace(',', '.'); }
    else { s = s.replace(/,/g,''); }
  } else if (lastComma !== -1){
    var commaCount = (s.match(/,/g)||[]).length;
    if (commaCount > 1) s = s.replace(/,/g,''); else s = s.replace(',', '.');
  } else if (lastDot !== -1){
    var dotCount = (s.match(/\./g)||[]).length;
    if (dotCount > 1) s = s.replace(/\./g,'');
  }
  var n = parseFloat(s);
  return n;
}
function isNonNegInt(n){ return !isNaN(n) && isFinite(n) && n >= 0 && Number.isInteger(n); }
function isNonNegNum(n){ return !isNaN(n) && isFinite(n) && n >= 0; }

var STATUS_LABELS = {nhap:'Nháp', da_dat:'Đã đặt hàng', nhap_mot_phan:'Nhập một phần', da_nhap_du:'Đã nhập đủ', da_huy:'Đã hủy'};
var VAT_LABELS = {khong:'Không VAT', da_vat:'Đã VAT (giá đã gồm 8%)', tuy_chinh:'VAT khác (tự nhập VAT/KG)'};
var LOAI_DIACHI_LABELS = {xuong_det:'Xưởng dệt hợp tác', kho_chinh:'Kho chính công ty'};

/* computeOrderTotals: cách tính phụ thuộc chế độ VAT của đơn hàng.
   - khong: không có VAT, thành tiền trước VAT = tổng ký × đơn giá, tổng tiền = thành tiền trước VAT.
   - da_vat: tổng ký × đơn giá là số tiền ĐÃ BAO GỒM 8% VAT -> tách ngược ra thành tiền trước VAT và tiền VAT.
   - tuy_chinh: tổng ký × đơn giá là thành tiền trước VAT (giữ nguyên); người dùng tự nhập số tiền VAT / KG (vatTien),
     tiền VAT = tổng số ký × vatTien, tổng tiền = thành tiền trước VAT + tiền VAT. */
function computeOrderTotals(o){
  var soThung = Number(o.soThung)||0, coi = Number(o.soCoiTrenThung)||0, ky = Number(o.soKyTrenThung)||0;
  var tongKy = soThung*ky, tongCoi = soThung*coi;
  var donGia = Number(o.donGiaKg)||0;
  var thanhTienGoc = tongKy*donGia;
  var thanhTienTruocVAT, tienVAT, tongTien;
  var vatMode = o.vat;
  if (vatMode === 'da_vat'){
    thanhTienTruocVAT = thanhTienGoc / 1.08;
    tienVAT = thanhTienGoc - thanhTienTruocVAT;
    tongTien = thanhTienGoc;
  } else if (vatMode === 'tuy_chinh'){
    thanhTienTruocVAT = thanhTienGoc;
    tienVAT = tongKy * (Number(o.vatTien)||0);
    tongTien = thanhTienTruocVAT + tienVAT;
  } else {
    thanhTienTruocVAT = thanhTienGoc;
    tienVAT = 0;
    tongTien = thanhTienTruocVAT;
  }
  return {tongKy:tongKy, tongCoi:tongCoi, thanhTienTruocVAT:thanhTienTruocVAT, tienVAT:tienVAT, tongTien:tongTien};
}
/* Di trú dữ liệu VAT cũ sang định dạng mới, giữ nguyên số tiền lịch sử. Chỉ chạy 1 lần duy nhất (có cờ đánh dấu)
   để không xử lý lặp lại làm sai lệch dữ liệu đã đúng của các đơn tạo sau khi di trú.
   - vat '0'/'8' (kiểu cũ nhất: VAT 8% cộng thêm trên thành tiền trước VAT) -> 'tuy_chinh' với VAT/KG = đơn giá × 8%.
   - vat 'tuy_chinh' nhưng vatTien khi đó là TỔNG số tiền VAT (bản trung gian) -> quy đổi thành VAT/KG = tổng tiền VAT / tổng số ký. */
function migrateOldVatData(){
  var v2Done = Storage.get('vat_migration_v2_done', false);
  if (v2Done) return;
  var orders = getOrders();
  var changed = false;
  orders.forEach(function(o){
    if (o.vat === '0'){
      o.vat = 'khong'; changed = true;
    } else if (o.vat === '8'){
      var donGia = Number(o.donGiaKg)||0;
      o.vat = 'tuy_chinh';
      o.vatTien = Math.round(donGia*0.08*10000)/10000;
      changed = true;
    } else if (o.vat === 'tuy_chinh'){
      var soThung = Number(o.soThung)||0, ky = Number(o.soKyTrenThung)||0;
      var tongKy = soThung*ky;
      if (tongKy > 0){
        o.vatTien = Math.round((Number(o.vatTien)||0) / tongKy * 10000)/10000;
        changed = true;
      }
    }
  });
  if (changed) saveOrders(orders);
  Storage.set('vat_migration_v2_done', true);
}
function getReceiptsByOrder(orderId){
  return getReceipts().filter(function(r){ return r.orderId === orderId; });
}
function sumReceivedThung(orderId){
  return getReceiptsByOrder(orderId).reduce(function(s,r){ return s + (Number(r.soThungNhap)||0); }, 0);
}
function computeRemaining(o){
  var received = sumReceivedThung(o.id);
  var soThung = Number(o.soThung)||0;
  var remainThung = Math.max(0, soThung - received);
  var ky = Number(o.soKyTrenThung)||0, coi = Number(o.soCoiTrenThung)||0;
  return {received:received, remainThung:remainThung, remainKy:remainThung*ky, remainCoi:remainThung*coi};
}
function computeAutoStatus(o){
  if (o.trangThai === 'nhap' || o.trangThai === 'da_huy') return o.trangThai;
  var received = sumReceivedThung(o.id);
  var soThung = Number(o.soThung)||0;
  if (received <= 0) return 'da_dat';
  if (received < soThung) return 'nhap_mot_phan';
  return 'da_nhap_du';
}
function generatePONumber(dateStr){
  var d = dateStr ? new Date(dateStr + 'T00:00:00') : new Date();
  if (isNaN(d.getTime())) d = new Date();
  var y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  var prefix = 'PO-' + y + m + day + '-';
  var orders = getOrders();
  var max = 0;
  orders.forEach(function(o){
    if (o.soPO && o.soPO.indexOf(prefix) === 0){
      var n = parseInt(o.soPO.slice(prefix.length), 10);
      if (!isNaN(n) && n > max) max = n;
    }
  });
  return prefix + String(max+1).padStart(3,'0');
}

        '</div>' +
      '</div>' +

    btn.classList.toggle('active', btn.getAttribute('data-section') === section);
  });

function parseRoute(){
  var hash = location.hash || '#/dashboard';
  hash = hash.replace(/^#\/?/, '');
  return hash.split('/').filter(Boolean).map(decodeURIComponent);
}
function route(){
  var parts = parseRoute();
  var content = document.getElementById('app-content');
  var sec = parts[0] || 'dashboard';
  updateActiveNav(sec === 'backup' ? 'backup' : sec);
  try{
    if (!parts.length || parts[0] === 'dashboard'){ renderDashboardPage(content); }
    else if (parts[0] === 'orders'){
      if (parts[1] === 'new') renderOrderFormPage(content, null);
      else if (parts[1] && parts[2] === 'edit') renderOrderFormPage(content, parts[1]);
      else if (parts[1] && parts[2] === 'receive') renderOrderDetailPage(content, parts[1], true);
      else if (parts[1]) renderOrderDetailPage(content, parts[1], false);
      else renderOrdersListPage(content);
    }
    else if (parts[0] === 'suppliers'){
      if (parts[1] === 'new') renderSupplierFormPage(content, null);
      else if (parts[1] && parts[2] === 'edit') renderSupplierFormPage(content, parts[1]);
      else if (parts[1]) renderSupplierDetailPage(content, parts[1]);
      else renderSuppliersListPage(content);
    }
    else if (parts[0] === 'addresses'){
      if (parts[1] === 'new') renderAddressFormPage(content, null);
      else if (parts[1] && parts[2] === 'edit') renderAddressFormPage(content, parts[1]);
      else renderAddressesListPage(content);
    }
    else if (parts[0] === 'reports'){ renderReportsPage(content); }
    else if (parts[0] === 'backup'){ renderBackupPage(content); }
    else { content.innerHTML = renderNotFound(); }
  }catch(err){
    reportError('Lỗi hiển thị trang: ' + err.message);

  }

}

function applyDashFilters(orders){
  return orders.filter(function(o){
    if (dashFilters.tu && o.ngayDatHang < dashFilters.tu) return false;
    if (dashFilters.den && o.ngayDatHang > dashFilters.den) return false;
    if (dashFilters.ncc && o.nhaCungCapId !== dashFilters.ncc) return false;
    if (dashFilters.trangthai && o.trangThai !== dashFilters.trangthai) return false;
    if (dashFilters.mathang){
      var q = dashFilters.mathang.toLowerCase();
      var hay = (o.tenHang||'') + ' ' + (o.maHang||'') + ' ' + (o.hieuSoi||'');
      if (hay.toLowerCase().indexOf(q) === -1) return false;
    }
    return true;
  });
}
function renderDashboardPage(content){
  var orders = applyDashFilters(getOrders());
  var totalTien=0,totalTienVAT=0,totalTienTruocVAT=0,totalThung=0,totalKy=0,totalCoi=0;
  var chuaNhapThung=0, chuaNhapKy=0, chuaNhapCoi=0;
  var supplierSet = {};
  orders.forEach(function(o){
    var t = computeOrderTotals(o);
    totalThung += Number(o.soThung)||0;
    totalKy += t.tongKy; totalCoi += t.tongCoi;
    totalTienTruocVAT += t.thanhTienTruocVAT; totalTienVAT += t.tienVAT; totalTien += t.tongTien;
    if (o.nhaCungCapId) supplierSet[o.nhaCungCapId] = true;
    if (o.trangThai === 'da_dat' || o.trangThai === 'nhap_mot_phan'){
      var rem = computeRemaining(o);
      chuaNhapThung += rem.remainThung; chuaNhapKy += rem.remainKy; chuaNhapCoi += rem.remainCoi;
    }
  });
  var supplierCount = Object.keys(supplierSet).length;
  var stats = [
    {label:'Tổng đơn hàng', value: formatInt(orders.length)},
    {label:'Tổng số thùng', value: formatInt(totalThung)},
    {label:'Tổng số ký (KG)', value: formatDec(totalKy,1)},
    {label:'Tổng số cối', value: formatInt(totalCoi)},
    {label:'Số nhà cung cấp', value: formatInt(supplierCount)},
    {label:'Thành tiền trước VAT', value: formatVND(totalTienTruocVAT)},
    {label:'Tổng tiền VAT', value: formatVND(totalTienVAT)},

    {label:'Số thùng chưa nhập', value: formatInt(chuaNhapThung), accent:'warn'},

/* ===================== 10. ĐƠN ĐẶT HÀNG: DANH SÁCH ===================== */
var orderFilters = {q:'', tu:'', den:'', ncc:'', trangthai:''};
function orderSearchHay(o){
  var s = getSuppliers().find(function(x){ return x.id===o.nhaCungCapId; });
  var receiptTxt = getReceiptsByOrder(o.id).map(function(r){ return r.soPhieuGiaoHang||''; }).join(' ');
  return [o.soPO, s?s.ten:'', o.tenHang, o.maHang, receiptTxt].join(' ').toLowerCase();
}
function applyOrderFilters(orders){
  return orders.filter(function(o){
    if (orderFilters.tu && o.ngayDatHang < orderFilters.tu) return false;
    if (orderFilters.den && o.ngayDatHang > orderFilters.den) return false;
    if (orderFilters.ncc && o.nhaCungCapId !== orderFilters.ncc) return false;
    if (orderFilters.trangthai && o.trangThai !== orderFilters.trangthai) return false;
    if (orderFilters.q && orderSearchHay(o).indexOf(orderFilters.q.toLowerCase()) === -1) return false;
    return true;
  });
}

    if (vat === 'da_vat') help.textContent = 'Đơn giá/KG nhập vào được hiểu là ĐÃ bao gồm 8% VAT. Hệ thống sẽ tự tách ra thành tiền trước VAT và tiền VAT.';
    else if (vat === 'tuy_chinh') help.textContent = 'Thành tiền trước VAT tính theo đơn giá bình thường (chưa VAT). Tiền VAT = Tổng số ký × Số tiền VAT/KG bạn nhập, rồi cộng vào tổng tiền.';
    else help.textContent = 'Đơn hàng không tính VAT.';

function recalcOrderFormTotals(){
  var soThung = parseVNNumber(document.getElementById('f-sothung').value);
  var coi = parseVNNumber(document.getElementById('f-coi').value);
  var ky = parseVNNumber(document.getElementById('f-ky').value);
  var donGia = parseVNNumber(document.getElementById('f-dongia').value);
  var vat = document.getElementById('f-vat').value;
  var stV = isNaN(soThung)?0:soThung, coiV = isNaN(coi)?0:coi, kyV = isNaN(ky)?0:ky, giaV = isNaN(donGia)?0:donGia;
  var tongKy = stV*kyV, tongCoi = stV*coiV;
  var thanhTienGoc = tongKy*giaV;
  var truocVAT, tienVAT, tongTien;
  if (vat === 'da_vat'){
    truocVAT = thanhTienGoc / 1.08;
    tienVAT = thanhTienGoc - truocVAT;
    tongTien = thanhTienGoc;
  } else if (vat === 'tuy_chinh'){
    var vatTienEl = document.getElementById('f-vattien');
    var vatTienKg = vatTienEl ? parseVNNumber(vatTienEl.value) : 0;
    if (isNaN(vatTienKg)) vatTienKg = 0;
    truocVAT = thanhTienGoc;
    tienVAT = tongKy * vatTienKg;
    tongTien = truocVAT + tienVAT;
  } else {
    truocVAT = thanhTienGoc;
    tienVAT = 0;
    tongTien = truocVAT;
  }
  document.getElementById('calc-tongky').textContent = formatDec(tongKy,2) + ' kg';
  document.getElementById('calc-tongcoi').textContent = formatInt(tongCoi) + ' cối';
  document.getElementById('calc-truocvat').textContent = formatVND(truocVAT);
  document.getElementById('calc-tienvat').textContent = formatVND(tienVAT);
  document.getElementById('calc-tongtien').textContent = formatVND(tongTien);
}

  var ky = parseVNNumber(document.getElementById('f-ky').value);
  var donGia = parseVNNumber(document.getElementById('f-dongia').value);

  if (!ncc){ setFieldError('f-ncc','Vui lòng chọn nhà cung cấp.'); ok=false; }
  if (!tenhang){ setFieldError('f-tenhang','Vui lòng nhập tên hàng.'); ok=false; }
  if (document.getElementById('f-sothung').value.trim()===''){ setFieldError('f-sothung','Vui lòng nhập số thùng.'); ok=false; }
  else if (!isNonNegInt(soThung)){ setFieldError('f-sothung','Số thùng phải là số nguyên, không âm.'); ok=false; }
  if (document.getElementById('f-coi').value.trim()===''){ setFieldError('f-coi','Vui lòng nhập số cối/thùng.'); ok=false; }
  else if (!isNonNegInt(coi)){ setFieldError('f-coi','Số cối/thùng phải là số nguyên, không âm.'); ok=false; }
  if (document.getElementById('f-ky').value.trim()===''){ setFieldError('f-ky','Vui lòng nhập số ký/thùng.'); ok=false; }
  else if (!isNonNegNum(ky)){ setFieldError('f-ky','Số ký/thùng phải là số không âm.'); ok=false; }
  if (document.getElementById('f-dongia').value.trim()===''){ setFieldError('f-dongia','Vui lòng nhập đơn giá/KG.'); ok=false; }
  else if (!isNonNegNum(donGia)){ setFieldError('f-dongia','Đơn giá/KG phải là số không âm.'); ok=false; }
  if (vat === 'tuy_chinh'){
    if (document.getElementById('f-vattien').value.trim()===''){ setFieldError('f-vattien','Vui lòng nhập số tiền VAT/KG (hoặc chọn "Không VAT" nếu không có VAT).'); ok=false; }
    else if (!isNonNegNum(vatTien)){ setFieldError('f-vattien','Số tiền VAT/KG phải là số không âm.'); ok=false; }
  }

  if (!ok){
    showToast('Vui lòng kiểm tra lại các trường được đánh dấu đỏ.', 'error');
    focusFirstError(form);
    return;
  }

  var orders = getOrders();
  if (orderId){
    var idx = orders.findIndex(function(x){ return x.id===orderId; });
    if (idx === -1){ showToast('Không tìm thấy đơn hàng để cập nhật.', 'error'); return; }
    var existing = orders[idx];
    var updated = Object.assign({}, existing, {
      ngayDatHang: ngay, nhaCungCapId: ncc, diaChiGiaoHangId: diachi || '', maHang: mahang, tenHang: tenhang, hieuSoi: hieusoi,
      soThung: soThung, soCoiTrenThung: coi, soKyTrenThung: ky, donGiaKg: donGia, vat: vat, vatTien: (vat==='tuy_chinh'?vatTien:0), trangThai: trangthai, ghiChu: ghichu,
      updatedAt: new Date().toISOString()
    });
    updated.trangThai = computeAutoStatus(updated);
    orders[idx] = updated;
    if (!saveOrders(orders)) return;
    showToast('Đã cập nhật đơn hàng ' + updated.soPO + '.', 'success');
    location.hash = '#/orders/' + updated.id;
  } else {
    var soPO = generatePONumber(ngay);
    var newOrder = {
      id: uid(), soPO: soPO, ngayDatHang: ngay, nhaCungCapId: ncc, diaChiGiaoHangId: diachi || '',
      maHang: mahang, tenHang: tenhang, hieuSoi: hieusoi, soThung: soThung, soCoiTrenThung: coi, soKyTrenThung: ky,
      donGiaKg: donGia, vat: vat, vatTien: (vat==='tuy_chinh'?vatTien:0), trangThai: trangthai, ghiChu: ghichu,
      createdAt: new Date().toISOString(), updatedAt: new Date().toISOString()
    };
    newOrder.trangThai = computeAutoStatus(newOrder);
    orders.push(newOrder);
    if (!saveOrders(orders)) return;
    showToast('Đã tạo đơn hàng ' + newOrder.soPO + '.', 'success');
    location.hash = '#/orders/' + newOrder.id;
  }
}
function handleDeleteOrder(orderId){
  var o = getOrders().find(function(x){ return x.id===orderId; });
  if (!o) return;
  showConfirm('Xóa đơn hàng', 'Bạn có chắc muốn xóa đơn hàng ' + o.soPO + '? Toàn bộ lịch sử nhận hàng của đơn này cũng sẽ bị xóa. Hành động này không thể hoàn tác.', function(){
    var orders = getOrders().filter(function(x){ return x.id!==orderId; });
    var receipts = getReceipts().filter(function(x){ return x.orderId!==orderId; });
    if (!saveOrders(orders)) return;
    if (!saveReceipts(receipts)) return;
    showToast('Đã xóa đơn hàng ' + o.soPO + '.', 'success');
    location.hash = '#/orders';
  }, {confirmText:'Xóa', dangerConfirm:true});
}

    '<button class="btn btn-secondary" onclick="exportOrderPDF(\'' + o.id + '\')">' + ICONS.file + ' Xuất PDF</button>' +

    '<div><div class="l">Hiệu sợi</div><div class="v">' + escapeHtml(o.hieuSoi||'—') + '</div></div>' +
  '</div>' + (o.ghiChu ? '<div style="margin-top:10px;"><div class="l" style="font-size:12px;color:var(--text-muted);font-weight:600;">Ghi chú</div><div>' + escapeHtml(o.ghiChu) + '</div></div>' : '') + '</div>';

  html += '<div class="card"><div class="card-title">Số lượng &amp; giá trị đặt hàng</div><div class="kv-list">' +

    '<div><div class="l">Tổng số cối</div><div class="v">' + formatInt(t.tongCoi) + '</div></div>' +

    receipts.forEach(function(r){
      var rTongKy = (Number(r.soThungNhap)||0)*(Number(r.soKyTrenThung)||0);
      var rTongCoi = (Number(r.soThungNhap)||0)*(Number(r.soCoiTrenThung)||0);
      html += '<tr><td>' + formatDateDMY(r.ngayNhap) + '</td><td class="num-cell">' + formatInt(r.soThungNhap) + '</td><td class="num-cell">' + formatInt(r.soCoiTrenThung) + '</td><td class="num-cell">' + formatDec(r.soKyTrenThung,2) + '</td><td class="num-cell">' + formatDec(rTongKy,2) + '</td><td class="num-cell">' + formatInt(rTongCoi) + '</td><td>' + escapeHtml(r.soPhieuGiaoHang||'—') + '</td><td>' + escapeHtml(r.ghiChu||'—') + '</td>' +
        '<td><button class="btn btn-danger btn-sm" onclick="handleDeleteReceipt(\'' + r.id + '\',\'' + o.id + '\')">' + ICONS.trash + '</button></td></tr>';
    });
    html += '</tbody></table></div>';
  }
  content.innerHTML = html;
  if (openReceive) openReceiveModal(o.id);
}
function handleDeleteReceipt(receiptId, orderId){
  showConfirm('Xóa lần nhận hàng', 'Bạn có chắc muốn xóa lần nhận hàng này? Trạng thái đơn hàng sẽ được tính lại.', function(){
    var receipts = getReceipts().filter(function(x){ return x.id!==receiptId; });
    if (!saveReceipts(receipts)) return;
    recalcOrderStatus(orderId);
    showToast('Đã xóa lần nhận hàng.', 'success');
    renderOrderDetailPage(document.getElementById('app-content'), orderId, false);
  }, {confirmText:'Xóa', dangerConfirm:true});
}
function recalcOrderStatus(orderId){
  var orders = getOrders();
  var idx = orders.findIndex(function(x){ return x.id===orderId; });
  if (idx === -1) return;
  orders[idx].trangThai = computeAutoStatus(orders[idx]);
  saveOrders(orders);
}

function openReceiveModal(orderId){
  var o = getOrders().find(function(x){ return x.id===orderId; });
  if (!o) return;
  var rem = computeRemaining(o);
  var bodyHtml = '<form id="receive-form" novalidate onsubmit="handleReceiveSubmit(event,\'' + orderId + '\'); return false;">' +
    '<p class="help-text" style="margin-bottom:12px;">Đơn hàng <strong>' + escapeHtml(o.soPO) + '</strong> — còn lại <strong>' + formatInt(rem.remainThung) + '</strong> thùng.</p>' +
    '<div class="form-row cols-2">' +
    '<div class="form-group"><label>Ngày nhập <span class="req">*</span></label><input type="date" id="r-ngay" class="input" value="' + todayISO() + '"><div class="field-error-msg" id="r-ngay-error"></div></div>' +
    '<div class="form-group"><label>Số thùng nhập <span class="req">*</span></label><input type="text" inputmode="numeric" id="r-sothung" class="input" oninput="recalcReceiveTotals(\'' + orderId + '\')"><div class="field-error-msg" id="r-sothung-error"></div></div>' +
    '</div>' +
    '<div class="form-row cols-2">' +
    '<div class="form-group"><label>Số cối/thùng</label><input type="text" inputmode="numeric" id="r-coi" class="input" value="' + escapeHtml(o.soCoiTrenThung) + '" oninput="recalcReceiveTotals(\'' + orderId + '\')"></div>' +
    '<div class="form-group"><label>Số ký/thùng</label><input type="text" inputmode="decimal" id="r-ky" class="input" value="' + escapeHtml(o.soKyTrenThung) + '" oninput="recalcReceiveTotals(\'' + orderId + '\')"></div>' +
    '</div>' +
    '<div class="calc-grid">' +
      '<div class="calc-item"><div class="l">Tổng ký nhập</div><div class="v" id="r-calc-ky">0 kg</div></div>' +
      '<div class="calc-item"><div class="l">Tổng cối nhập</div><div class="v" id="r-calc-coi">0 cối</div></div>' +
    '</div>' +
    '<div class="form-group" style="margin-top:12px;"><label>Số phiếu giao hàng <span class="optional-tag">(không bắt buộc)</span></label><input type="text" id="r-sophieu" class="input"></div>' +
    '<div class="form-group"><label>Ghi chú <span class="optional-tag">(không bắt buộc)</span></label><textarea id="r-ghichu" class="input"></textarea></div>' +
    '<div class="modal-actions"><button type="button" class="btn btn-secondary" onclick="closeModal(); location.hash=\'#/orders/' + orderId + '\';">Hủy</button><button type="submit" class="btn btn-primary">Ghi nhận nhập hàng</button></div>' +
    '</form>';
  showModalHTML('Nhận hàng', bodyHtml);
  recalcReceiveTotals(orderId);
}
function recalcReceiveTotals(orderId){
  var st = parseVNNumber(document.getElementById('r-sothung').value);
  var coi = parseVNNumber(document.getElementById('r-coi').value);
  var ky = parseVNNumber(document.getElementById('r-ky').value);
  var stV = isNaN(st)?0:st, coiV = isNaN(coi)?0:coi, kyV = isNaN(ky)?0:ky;
  document.getElementById('r-calc-ky').textContent = formatDec(stV*kyV,2) + ' kg';
  document.getElementById('r-calc-coi').textContent = formatInt(stV*coiV) + ' cối';
}
function handleReceiveSubmit(event, orderId){
  event.preventDefault();
  var form = document.getElementById('receive-form');
  clearFormErrors(form);
  var ngay = document.getElementById('r-ngay').value;
  var soThung = parseVNNumber(document.getElementById('r-sothung').value);
  var coi = parseVNNumber(document.getElementById('r-coi').value);
  var ky = parseVNNumber(document.getElementById('r-ky').value);
  var sophieu = document.getElementById('r-sophieu').value.trim();
  var ghichu = document.getElementById('r-ghichu').value.trim();

  var ok = true;
  if (!ngay){ setFieldError('r-ngay','Vui lòng chọn ngày nhập.'); ok=false; }
  if (document.getElementById('r-sothung').value.trim()===''){ setFieldError('r-sothung','Vui lòng nhập số thùng.'); ok=false; }
  else if (!isNonNegInt(soThung) || soThung<=0){ setFieldError('r-sothung','Số thùng nhập phải là số nguyên lớn hơn 0.'); ok=false; }
  if (!isNonNegInt(coi)){ setFieldError('r-coi','Số cối/thùng phải là số nguyên, không âm.'); ok=false; }
  if (!isNonNegNum(ky)){ setFieldError('r-ky','Số ký/thùng phải là số không âm.'); ok=false; }
  if (!ok){ showToast('Vui lòng kiểm tra lại các trường được đánh dấu đỏ.', 'error'); focusFirstError(form); return; }

  var o = getOrders().find(function(x){ return x.id===orderId; });
  if (!o){ showToast('Không tìm thấy đơn hàng.', 'error'); return; }
  var rem = computeRemaining(o);
  var pending = {orderId: orderId, ngayNhap: ngay, soThungNhap: soThung, soCoiTrenThung: coi, soKyTrenThung: ky, soPhieuGiaoHang: sophieu, ghiChu: ghichu};

  if (soThung > rem.remainThung){
    showConfirm('Nhập vượt số lượng còn lại', 'Số thùng nhập (' + formatInt(soThung) + ') vượt quá số thùng còn lại (' + formatInt(rem.remainThung) + ') của đơn hàng ' + o.soPO + '. Bạn có chắc vẫn muốn ghi nhận nhập vượt số lượng?', function(){
      doSaveReceipt(pending);
    }, {confirmText:'Vẫn ghi nhận', cancelText:'Hủy', dangerConfirm:true, onCancel:function(){ openReceiveModal(orderId); }});
  } else {
    doSaveReceipt(pending);
  }
}
function doSaveReceipt(pending){
  var receipts = getReceipts();
  var newReceipt = Object.assign({id: uid(), createdAt: new Date().toISOString()}, pending);
  receipts.push(newReceipt);
  if (!saveReceipts(receipts)) return;
  recalcOrderStatus(pending.orderId);
  closeModal();
  showToast('Đã ghi nhận nhập hàng.', 'success');
  location.hash = '#/orders/' + pending.orderId;
  renderOrderDetailPage(document.getElementById('app-content'), pending.orderId, false);
}

var reportFilters = {tu:'', den:''};
function reportFilteredOrders(){
  return getOrders().filter(function(o){
    if (reportFilters.tu && o.ngayDatHang < reportFilters.tu) return false;
    if (reportFilters.den && o.ngayDatHang > reportFilters.den) return false;
    return true;
  });
}
function groupBy(orders, keyFn, labelFn){
  var map = {};
  orders.forEach(function(o){
    var key = keyFn(o);
    if (!map[key]) map[key] = {key:key, label: labelFn(o), count:0, thung:0, ky:0, coi:0, truocVAT:0, tienVAT:0, tongTien:0};
    var g = map[key];
    var t = computeOrderTotals(o);
    g.count++; g.thung += Number(o.soThung)||0; g.ky += t.tongKy; g.coi += t.tongCoi;
    g.truocVAT += t.thanhTienTruocVAT; g.tienVAT += t.tienVAT; g.tongTien += t.tongTien;
  });
  return Object.keys(map).map(function(k){ return map[k]; }).sort(function(a,b){ return a.label.localeCompare(b.label,'vi'); });
}
function reportTableHtml(headers, rows){
  var html = '<div class="table-wrap"><table><thead><tr>' + headers.map(function(h){ return '<th' + (h.num?' class="num-cell"':'') + '>'+h.label+'</th>'; }).join('') + '</tr></thead><tbody>';
  if (!rows.length){ html += '<tr><td colspan="'+headers.length+'" style="text-align:center;color:var(--text-muted);">Không có dữ liệu.</td></tr>'; }
  rows.forEach(function(r){ html += '<tr>' + r.map(function(c,i){ return '<td' + (headers[i].num?' class="num-cell"':'') + '>'+c+'</td>'; }).join('') + '</tr>'; });
  html += '</tbody></table></div>';
  return html;
}

function exportBackupJSON(){
  try{
    var payload = {app:'qldh', version:1, exportedAt: new Date().toISOString(),
      orders: getOrders(), receipts: getReceipts(), suppliers: getSuppliers(), addresses: getAddresses()};
    var blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
    var d = new Date();
    var fname = 'sao-luu-qldh-' + d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0') + '-' + String(d.getHours()).padStart(2,'0') + String(d.getMinutes()).padStart(2,'0') + '.json';
    exportBlob(blob, fname, 'application/json');

function handleRestoreFile(inputEl){
  var file = inputEl.files && inputEl.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onerror = function(){ reportError('Không đọc được tệp đã chọn.'); };
  reader.onload = function(){
    var data;
    try{ data = JSON.parse(reader.result); }
    catch(err){ showToast('Tệp không đúng định dạng JSON hợp lệ.', 'error'); inputEl.value=''; return; }
    if (!data || typeof data !== 'object' || !Array.isArray(data.orders) || !Array.isArray(data.suppliers)){
      showToast('Tệp không đúng định dạng sao lưu của ứng dụng này.', 'error'); inputEl.value=''; return;
    }
    showConfirm('Phục hồi dữ liệu', 'Việc phục hồi sẽ GHI ĐÈ toàn bộ dữ liệu hiện tại trên thiết bị này bằng dữ liệu trong tệp đã chọn. Bạn có chắc muốn tiếp tục?', function(){
      var ok = saveOrders(data.orders||[]) && saveReceipts(data.receipts||[]) && saveSuppliers(data.suppliers||[]) && saveAddresses(data.addresses||[]);
      if (ok){ showToast('Đã phục hồi dữ liệu thành công.', 'success'); location.hash = '#/dashboard'; setTimeout(function(){ location.reload(); }, 300); }
      inputEl.value='';
    }, {confirmText:'Ghi đè và phục hồi', dangerConfirm:true, onCancel:function(){ inputEl.value=''; }});
  };
  reader.readAsText(file);
}
function handleResetAllData(){
  showConfirm('Xóa toàn bộ dữ liệu', 'Toàn bộ đơn hàng, nhận hàng, nhà cung cấp và địa chỉ trên thiết bị này sẽ bị xóa vĩnh viễn. Hành động này không thể hoàn tác. Bạn có chắc chắn?', function(){
    var ok = saveOrders([]) && saveReceipts([]) && saveSuppliers([]) && saveAddresses([]);

}

/* ===================== 18. XUẤT FILE: CHIA SẺ / TẢI XUỐNG ===================== */
async function exportBlob(blob, filename, mimeType){
  try{
    var file;
    try{ file = new File([blob], filename, {type: mimeType}); }catch(e){ file = null; }
    if (file && navigator.canShare && navigator.canShare({files:[file]})){
      try{
        await navigator.share({files:[file], title: filename});
        showToast('Đã chia sẻ / lưu tệp "' + filename + '".', 'success');
        return;
      }catch(shareErr){
        if (shareErr && shareErr.name === 'AbortError') return;
        // rơi xuống phương án tải xuống dự phòng
      }
    }
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename; a.style.display='none';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 4000);
    showToast('Đã tải xuống tệp "' + filename + '".', 'success');
  }catch(err){
    reportError('Lỗi khi xuất tệp "' + filename + '": ' + err.message);
  }
}
function checkLib(name, obj){
  if (typeof obj === 'undefined'){
    showToast('Không tải được thư viện "' + name + '" (cần kết nối Internet). Vui lòng kiểm tra mạng và thử lại.', 'error');
    return false;
  }
  return true;
}

function buildSheetWithFormats(headers, rows, numericCols){
  var aoa = [headers].concat(rows);
  var ws = XLSX.utils.aoa_to_sheet(aoa);
  var range = XLSX.utils.decode_range(ws['!ref']);
  (numericCols||[]).forEach(function(nc){
    for (var r=1; r<=range.e.r; r++){
      var addr = XLSX.utils.encode_cell({r:r, c:nc.col});
      var cell = ws[addr];
      if (cell && typeof cell.v === 'number') cell.z = nc.format;
    }
  });
  ws['!cols'] = headers.map(function(h){ return {wch: Math.max(13, String(h).length+3)}; });
  return ws;
}
function downloadWorkbook(ws, sheetName, filename){
  if (!checkLib('SheetJS (xlsx)', window.XLSX)) return;
  try{
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, sheetName);
    var out = XLSX.write(wb, {bookType:'xlsx', type:'array'});
    var blob = new Blob([out], {type:'application/octet-stream'});
    exportBlob(blob, filename, 'application/octet-stream');
  }catch(err){ reportError('Lỗi khi tạo tệp Excel: ' + err.message); }
}

      Number(o.soThung)||0, Number(o.soCoiTrenThung)||0, Number(o.soKyTrenThung)||0, t.tongKy, t.tongCoi, Number(o.donGiaKg)||0,

  try{
    var res = await renderPhieuToCanvas(orderId);
    await new Promise(function(resolve){
      res.canvas.toBlob(function(blob){
        if (!blob){ reportError('Không tạo được ảnh JPEG.'); resolve(); return; }
        exportBlob(blob, 'phieu-dat-hang-' + res.order.soPO + '.jpg', 'image/jpeg').then(resolve);
      }, 'image/jpeg', 0.92);
    });
  }catch(err){ reportError('Lỗi khi xuất JPEG: ' + err.message); }
}
async function exportOrderPDF(orderId){
  if (!checkLib('html2canvas', window.html2canvas)) return;
  if (!checkLib('jsPDF', window.jspdf)) return;
  showToast('Đang tạo PDF...', 'info');
  try{
    var res = await renderPhieuToCanvas(orderId);
    var imgData = res.canvas.toDataURL('image/jpeg', 0.95);
    var pdf = new window.jspdf.jsPDF({unit:'pt', format:'a4'});
    var pageWidth = pdf.internal.pageSize.getWidth();
    var pageHeight = pdf.internal.pageSize.getHeight();
    var margin = 24;
    var imgWidth = pageWidth - margin*2;
    var imgHeight = res.canvas.height * imgWidth / res.canvas.width;
    var heightLeft = imgHeight;
    var position = margin;
    pdf.addImage(imgData, 'JPEG', margin, position, imgWidth, imgHeight);
    heightLeft -= (pageHeight - margin*2);
    while (heightLeft > 0){
      position = heightLeft - imgHeight + margin;
      pdf.addPage();
      pdf.addImage(imgData, 'JPEG', margin, position, imgWidth, imgHeight);
      heightLeft -= (pageHeight - margin*2);
    }
    var blob = pdf.output('blob');
    await exportBlob(blob, 'phieu-dat-hang-' + res.order.soPO + '.pdf', 'application/pdf');
  }catch(err){ reportError('Lỗi khi xuất PDF: ' + err.message); }
}

/* ===================== 21. KHỞI TẠO ỨNG DỤNG ===================== */
function initApp(){
  checkStorageAvailable();
  try{ migrateOldVatData(); }catch(err){ reportError('Lỗi khi cập nhật định dạng dữ liệu VAT cũ: ' + err.message); }
  renderNav();
  window.addEventListener('hashchange', route);
  route();
}
if (document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', initApp);
} else {
  initApp();
}
</script>
